name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        options: ['debug', 'release', 'both']
        default: 'both'

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: 34
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_TARGET_SDK: 34

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_TARGET_SDK }}
          target: android
          build-tools-version: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Install pnpm
        run: npm install -g pnpm@8

      - name: Install dependencies
        working-directory: apps/admin
        run: pnpm install

      - name: Initialize Capacitor Android
        working-directory: apps/admin
        run: |
          npx cap init TRACE com.muet.trace --web-dir=dist 2>/dev/null || true
          npx cap add android 2>/dev/null || true

      - name: Build web app
        working-directory: apps/admin
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build

      - name: Sync Capacitor Android
        working-directory: apps/admin
        run: npx cap sync android

      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release'
        working-directory: apps/android
        run: ./gradlew assembleDebug

      - name: Build Release APK
        if: github.event.inputs.build_type != 'debug'
        working-directory: apps/android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > keystore.properties << EOF
          storePassword=${RELEASE_STORE_PASSWORD}
          keyPassword=${RELEASE_KEY_PASSWORD}
          keyAlias=trace-key
          storeFile=../keystore.jks
          EOF
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ../keystore.jks
          ./gradlew assembleRelease

      - name: Upload Debug APK artifact
        if: github.event.inputs.build_type != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: trace-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK artifact
        if: github.event.inputs.build_type != 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: trace-release-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Verify APK signature
        if: github.event.inputs.build_type != 'debug'
        working-directory: apps/android/app/build/outputs/apk/release
        run: |
          $ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/apksigner verify app-release.apk || echo "Warning: apksigner not available"
